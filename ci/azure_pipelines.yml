trigger:
  branches:
    include:
      - main
      - feature/*

# Azure Repos PR validation must also be enabled as a branch policy.
pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-24.04

jobs:
  - job: Unit
    displayName: Unit regression (Python 3.13)
    timeoutInMinutes: 15
    steps:
      - checkout: self
        clean: true
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.13'
      - bash: |
          set -euo pipefail
          python -m pip install -r requirements/requirements_dev.txt -c requirements/constraints-local-py313.txt
          python -m pip check
          python -m compileall -q scripts src dags tests
        displayName: Install and check syntax
      - bash: python scripts/run_ci_tests.py --suite unit
        displayName: Discover all unit tests
      - template: templates/test_results.yml
        parameters:
          suite: unit

  - job: Spark
    displayName: Real Spark and Parquet integration
    timeoutInMinutes: 30
    steps:
      - checkout: self
        clean: true
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.11'
      - bash: |
          set -euo pipefail
          python -m pip install -r requirements/requirements_phase10.txt
          python -m pip check
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export PYSPARK_PYTHON="$(command -v python)"
          java -version
          python scripts/run_ci_tests.py --suite spark
        env:
          EV_RUN_SPARK_TESTS: '1'
          SPARK_LOCAL_IP: '127.0.0.1'
          SPARK_MASTER: 'local[2]'
          SPARK_SHUFFLE_PARTITIONS: '2'
        displayName: Run required Spark suite (no skips)
      - template: templates/test_results.yml
        parameters:
          suite: spark

  - job: Airflow
    displayName: Airflow 2.10.5 real DAG execution
    timeoutInMinutes: 30
    steps:
      - checkout: self
        clean: true
      - bash: |
          set -euo pipefail
          docker build -t ev-airflow-ci docker/phase10_airflow
          mkdir -p test-results
          chmod a+w test-results
          docker run --rm \
            --entrypoint /bin/bash \
            -v "$PWD:/workspace" -w /workspace \
            -e AIRFLOW_HOME=/tmp/airflow-ci \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=False \
            -e AIRFLOW__CORE__EXECUTOR=SequentialExecutor \
            -e AIRFLOW__CORE__DAGS_FOLDER=/workspace/dags \
            -e EV_PROJECT_ROOT=/workspace \
            -e SPARK_LOCAL_IP=127.0.0.1 \
            -e 'SPARK_MASTER=local[2]' \
            -e SPARK_SHUFFLE_PARTITIONS=2 \
            ev-airflow-ci -euo pipefail -c \
            'export PYSPARK_PYTHON="$(command -v python)"; python -m pip check; airflow db migrate; python scripts/run_ci_tests.py --suite airflow'
        displayName: Migrate isolated DB and execute required Airflow suite
      - template: templates/test_results.yml
        parameters:
          suite: airflow

  - job: Package
    displayName: Publish only after every required suite passes
    dependsOn:
      - Unit
      - Spark
      - Airflow
    condition: succeeded()
    steps:
      - checkout: self
        clean: true
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.13'
      - bash: |
          set -euo pipefail
          python -m pip install -r requirements/requirements_cd.txt
          python -m pip check
        displayName: Install release dependencies
      - bash: |
          set -euo pipefail
          python scripts/build_test_release.py \
            --output "$(Build.ArtifactStagingDirectory)/ev-test-release" \
            --commit "$BUILD_SOURCEVERSION" \
            --build-id "$BUILD_BUILDID" \
            --branch "$BUILD_SOURCEBRANCH"
        displayName: Build and verify Test release

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/ev-test-release'
          artifact: ev-test-release
          publishLocation: pipeline
        displayName: Publish Test release

      - bash: |
          set -euo pipefail

          mkdir -p "$(Build.ArtifactStagingDirectory)/ev-source"

          git archive \
            --format=zip \
            --output="$(Build.ArtifactStagingDirectory)/ev-source/source.zip" \
            HEAD

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          folder = Path(os.environ["BUILD_ARTIFACTSTAGINGDIRECTORY"]) / "ev-source"
          source = folder / "source.zip"

          manifest = {
              "commit_sha": os.environ["BUILD_SOURCEVERSION"],
              "build_id": os.environ["BUILD_BUILDID"],
              "source_branch": os.environ["BUILD_SOURCEBRANCH"],
              "source_zip_sha256": hashlib.sha256(source.read_bytes()).hexdigest()
          }

          (folder / "manifest.json").write_text(
              json.dumps(manifest, indent=2),
              encoding="utf-8"
          )
          PY
        displayName: Package verified source

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/ev-source'
          artifact: ev-source
          publishLocation: pipeline
        displayName: Publish verified source artifact
